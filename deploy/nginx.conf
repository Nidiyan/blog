# Example nginx site config for serving the built blog on an Azure VM.
# Copy to /etc/nginx/sites-available/blog and symlink into sites-enabled.
server {
    listen 80;
    server_name _;  # replace with your domain

    root /var/www/blog;  # contents of the `dist/` folder
    index index.html;

    # Send unknown paths to index.html so React Router can handle
    # client-side routes like /posts and /about on page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets have hashed file names, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
